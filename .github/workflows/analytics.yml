name: Analytics

# Pulls dinnersplit.app traffic out of the Cloudflare GraphQL API and prints it
# as one line per number, so `gh run view --log` is readable without a dashboard.
#
# The deploy token cannot read analytics: it is scoped to Pages only and sees
# zero zones. This workflow therefore needs CLOUDFLARE_ANALYTICS_TOKEN, a token
# with Account Analytics: Read + Zone Analytics: Read + Zone: Read.
#
#   gh workflow run analytics.yml
#   gh run watch && gh run view --log

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Query Cloudflare GraphQL
        run: |
          set -uo pipefail

          api() {
            curl -s -X POST https://api.cloudflare.com/client/v4/graphql \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data @-
          }

          ZONE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=dinnersplit.app" \
            -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result[0].id // empty')

          SINCE48=$(date -u -d '-48 hours' +%Y-%m-%dT%H:%M:%SZ)
          SINCE26=$(date -u -d '-30 hours' +%Y-%m-%dT%H:%M:%SZ)
          echo "zone=${ZONE:-none} since26=$SINCE26"

          # Web Analytics / RUM: real browsers only, account scoped.
          echo "== pageviews per day =="
          jq -cn --arg q "query { viewer { accounts(filter:{accountTag:\"$CF_ACCOUNT\"}) { rumPageloadEventsAdaptiveGroups(limit:100, filter:{datetime_geq:\"$SINCE26\"}) { count dimensions { date bot } } } } }" '{query:$q}' | api \
            | jq -r 'if .errors then "ERROR \(.errors)" else (.data.viewer.accounts[0].rumPageloadEventsAdaptiveGroups[] | [.dimensions.date, (if .dimensions.bot then "bot" else "human" end), .count] | @tsv) end'

          echo "== top paths =="
          jq -cn --arg q "query { viewer { accounts(filter:{accountTag:\"$CF_ACCOUNT\"}) { rumPageloadEventsAdaptiveGroups(limit:40, filter:{datetime_geq:\"$SINCE26\"}, orderBy:[count_DESC]) { count dimensions { requestPath } } } } }" '{query:$q}' | api \
            | jq -r 'if .errors then "ERROR \(.errors)" else (.data.viewer.accounts[0].rumPageloadEventsAdaptiveGroups[] | [.count, .dimensions.requestPath] | @tsv) end'

          echo "== referrers =="
          jq -cn --arg q "query { viewer { accounts(filter:{accountTag:\"$CF_ACCOUNT\"}) { rumPageloadEventsAdaptiveGroups(limit:40, filter:{datetime_geq:\"$SINCE26\"}, orderBy:[count_DESC]) { count dimensions { refererHost } } } } }" '{query:$q}' | api \
            | jq -r 'if .errors then "ERROR \(.errors)" else (.data.viewer.accounts[0].rumPageloadEventsAdaptiveGroups[] | [.count, .dimensions.refererHost] | @tsv) end'

          if [ -z "$ZONE" ]; then
            echo "== zone analytics skipped: token cannot see the zone =="
            exit 0
          fi

          echo "== raw requests per hour (all traffic, bots included) =="
          jq -cn --arg q "query { viewer { zones(filter:{zoneTag:\"$ZONE\"}) { httpRequests1hGroups(limit:200, filter:{datetime_geq:\"$SINCE48\"}, orderBy:[datetime_ASC]) { dimensions { datetime } sum { requests pageViews } uniq { uniques } } } } }" '{query:$q}' | api \
            | jq -r 'if .errors then "ERROR \(.errors)" else (.data.viewer.zones[0].httpRequests1hGroups[] | [.dimensions.datetime, .sum.requests, .sum.pageViews, .uniq.uniques] | @tsv) end'

          echo "== top request paths (all traffic, bots included) =="
          jq -cn --arg q "query { viewer { zones(filter:{zoneTag:\"$ZONE\"}) { httpRequestsAdaptiveGroups(limit:40, filter:{datetime_geq:\"$SINCE26\"}, orderBy:[count_DESC]) { count dimensions { clientRequestPath } } } } }" '{query:$q}' | api \
            | jq -r 'if .errors then "ERROR \(.errors)" else (.data.viewer.zones[0].httpRequestsAdaptiveGroups[] | [.count, .dimensions.clientRequestPath] | @tsv) end'
