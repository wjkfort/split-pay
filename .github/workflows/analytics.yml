name: Analytics

# Reads the zone's traffic from the Cloudflare GraphQL API using the same
# API token the deploy workflow already holds, so no analytics credential
# ever leaves GitHub. Dispatch it by hand when you want the numbers:
#
#   gh workflow run analytics.yml
#   gh run watch && gh run view --log

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Query Cloudflare GraphQL
        run: |
          set -uo pipefail

          grit() {
            curl -s "$@" -H "Authorization: Bearer $CF_TOKEN"
          }
          api() {
            curl -s -X POST https://api.cloudflare.com/client/v4/graphql \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data @-
          }

          SINCE26=$(date -u -d '-26 hours' +%Y-%m-%dT%H:%M:%SZ)
          echo "== token verify =="
          grit https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, errors, status: .result.status}'

          echo "== zones visible to this token =="
          grit https://api.cloudflare.com/client/v4/zones | jq -c '{success, errors, names: [.result[]?.name]}'

          echo "== pages projects =="
          grit "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" | jq -c '{success, errors, names: [.result[]?.name]}'

          echo "== rum sites =="
          grit "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/rum/site_info/list" | jq -c '{success, errors, sites: [.result[]? | {host: .host, site_tag: .site_tag}]}'

          echo "== rum dataset names =="
          q='query { __schema { types { name } } }'
          jq -cn --arg q "$q" '{query:$q}' | api | jq -c '[.data.__schema.types[].name | select(test("um"))]'

          echo "== rum group type fields =="
          for t in AccountRumPageloadEventsAdaptiveGroups AccountRumPageloadEventsAdaptiveGroupsDimensions; do
            q="query { __type(name: \"$t\") { name fields { name } } }"
            jq -cn --arg q "$q" '{query:$q}' | api
            echo
          done

          echo "== rum graphql =="
          q="query { viewer { accounts(filter:{accountTag:\"$CF_ACCOUNT\"}) { rumPageloadEventsAdaptiveGroups(limit:50, filter:{datetime_geq:\"$SINCE26\"}, orderBy:[count_DESC]) { count dimensions { date path refererHost } } } } }"
          jq -cn --arg q "$q" '{query:$q}' | api | jq -c '.'
